<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      margin: 0;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #222222);
    }
    h3 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 20px;
    }
    label {
      font-weight: 600;
      font-size: 14px;
      display: block;
      margin-top: 12px;
    }
    select, input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 6px 0 12px;
      font-size: 16px;
      border: 1px solid var(--tg-theme-hint-color, #dcdcdc);
      border-radius: 8px;
      background: var(--tg-theme-secondary-bg-color, #f7f7f8);
      color: var(--tg-theme-text-color, #222222);
      outline: none;
    }
    select:focus, input:focus {
      border-color: var(--tg-theme-button-color, #2481cc);
    }
  </style>
</head>
<body>
  <h3>Book an appointment</h3>
  <label for="service">Service</label>
  <select id="service">
    <option>Haircut</option>
    <option>Coloring</option>
    <option>Beard trim</option>
  </select>

  <label for="date">Date</label>
  <input type="date" id="date">

  <label for="time">Time</label>
  <select id="time">
    <option>10:00</option>
    <option>11:00</option>
    <option>12:00</option>
    <option>14:00</option>
    <option>15:00</option>
    <option>16:00</option>
  </select>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Prevent selecting past dates & default to today
    const dateInput = document.getElementById("date");
    const today = new Date().toISOString().split("T")[0];
    dateInput.min = today;
    dateInput.value = today;

    // Telegram native MainButton
    tg.MainButton.setText("Confirm booking");
    tg.MainButton.show();
    tg.MainButton.onClick(() => {
      const date = dateInput.value;
      if (!date) {
        tg.showAlert("Please pick a date");
        return;
      }
      tg.sendData(JSON.stringify({
        service: document.getElementById("service").value,
        date: date,
        time: document.getElementById("time").value
      }));
      tg.close();
    });
  </script>
</body>
</html>
