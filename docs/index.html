<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ቦቲካ ሾውሩም // Boutique Showroom</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* ── Clean Light Retail Palette (High-Performance, Low-RAM) ───── */
    :root {
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --amber: #f59e0b;
      --amber-dark: #d97706;
      --amber-light: #fef3c7;
      --green: #10b981;
      --telebirr: #0088cc;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Ethiopic", "Nyala", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.4;
      padding-bottom: 80px;
    }

    /* ── Header & Language Switcher ───────────────────────────────── */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 30;
      background: #ffffff;
      border-bottom: 1px solid var(--card-border);
      padding: 10px 14px 6px;
    }

    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lang-toggle-btn {
      background: #f1f5f9;
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ── Fast Search ─────────────────────────────────────────────── */
    .search-box {
      position: relative;
      margin-bottom: 8px;
    }

    .search-input {
      width: 100%;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius);
      padding: 9px 12px 9px 34px;
      font-size: 13.5px;
      color: var(--text);
      outline: none;
    }

    .search-input:focus {
      background: #ffffff;
      border-color: var(--amber-dark);
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* ── Department Carousel ─────────────────────────────────────── */
    .dept-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .dept-scroll::-webkit-scrollbar { display: none; }

    .dept-pill {
      flex-shrink: 0;
      background: #ffffff;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 11px;
      border-radius: 18px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .dept-pill.active {
      background: var(--text);
      color: #ffffff;
      border-color: var(--text);
    }

    /* ── Secondary Size Filter ───────────────────────────────────── */
    .size-filter-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 8px 14px 4px;
    }
    .size-filter-bar::-webkit-scrollbar { display: none; }

    .size-tag-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .size-chip {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: var(--text);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .size-chip.active {
      background: var(--amber-light);
      border-color: var(--amber-dark);
      color: var(--amber-dark);
      font-weight: 800;
    }

    /* ── Subtitle / Stock Counter ────────────────────────────────── */
    .catalog-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 14px;
      font-size: 11.5px;
      color: var(--text-muted);
    }
    .catalog-bar b { color: var(--text); }

    /* ── Optimized Grid ─────────────────────────────────────────── */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 4px 12px 14px;
    }

    @media (min-width: 600px) {
      .product-grid { grid-template-columns: repeat(3, 1fr); }
    }

    /* ── Fast Card ───────────────────────────────────────────────── */
    .card {
      background: #ffffff;
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      contain: content; /* Massive RAM/Rendering optimization for WebKit */
    }

    .card:active { opacity: 0.92; }

    .card-img-wrap {
      width: 100%;
      height: 150px;
      background: #e2e8f0;
      position: relative;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      font-size: 8.5px;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 3px;
      text-transform: uppercase;
    }

    .badge-primary { background: #0f172a; color: #ffffff; }
    .badge-rare { background: #dc2626; color: #ffffff; }
    .badge-amber { background: var(--amber); color: #0f172a; }

    .size-pill {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--card-border);
      font-size: 10.5px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 4px;
    }

    .card-body {
      padding: 8px 8px 10px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .brand-name {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .title-name {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 30px;
    }

    .card-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 6px;
      border-top: 1px solid #f1f5f9;
    }

    .price-value {
      font-size: 14.5px;
      font-weight: 900;
      color: var(--text);
    }

    .claim-pill {
      background: var(--amber);
      color: #0f172a;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10.5px;
      font-weight: 800;
      cursor: pointer;
    }

    /* ── Pagination / Load More ──────────────────────────────────── */
    .load-more-wrap {
      text-align: center;
      padding: 10px 14px 20px;
    }

    .load-more-btn {
      background: #ffffff;
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 13px;
      font-weight: 800;
      padding: 10px 24px;
      border-radius: 20px;
      cursor: pointer;
    }

    /* ── Claim Sheet Modal ───────────────────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal-sheet {
      background: #ffffff;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      width: 100%;
      max-width: 500px;
      padding: 16px 18px 28px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .sheet-handle {
      width: 36px;
      height: 4px;
      background: #cbd5e1;
      border-radius: 2px;
      margin: 0 auto 12px;
    }

    .modal-top-row {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

    .modal-img {
      width: 72px;
      height: 72px;
      border-radius: 6px;
      object-fit: cover;
      background: #f1f5f9;
      border: 1px solid var(--card-border);
      flex-shrink: 0;
    }

    .modal-details { flex: 1; }
    .m-brand { font-size: 10.5px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); }
    .m-title { font-size: 14px; font-weight: 800; color: var(--text); margin: 2px 0 4px; }
    .m-chips { display: flex; gap: 6px; align-items: center; }
    .m-chip { font-size: 10.5px; font-weight: 800; background: #f1f5f9; padding: 2px 6px; border-radius: 4px; }
    .m-price { font-size: 16px; font-weight: 900; color: var(--text); margin-left: auto; }

    .payment-notice {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
      border-radius: 6px;
      padding: 9px 12px;
      font-size: 11.5px;
      margin-bottom: 12px;
      line-height: 1.45;
    }

    .pay-methods-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
      font-weight: 800;
    }

    .pay-tag {
      background: #ffffff;
      border: 1px solid #10b981;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10.5px;
    }

    .modal-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .ful-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .ful-card {
      border: 1.5px solid var(--card-border);
      background: #ffffff;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .ful-card.selected {
      border-color: var(--amber-dark);
      background: #fffbeb;
    }

    .ful-card h4 { font-size: 12.5px; font-weight: 800; margin-bottom: 2px; }
    .ful-card p { font-size: 10.5px; color: var(--text-muted); }

    .modal-input {
      width: 100%;
      background: #f8f9fa;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13.5px;
      color: var(--text);
      outline: none;
      margin-bottom: 14px;
    }

    .action-buttons-row {
      display: flex;
      gap: 8px;
    }

    .call-btn {
      flex: 1;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: var(--text);
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .claim-btn-main {
      flex: 2;
      background: var(--amber);
      color: #0f172a;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 13.5px;
      font-weight: 900;
      cursor: pointer;
    }

    .claim-btn-main:active { background: var(--amber-dark); }
  </style>
</head>
<body>

  <!-- Top Navigation & Brand Header -->
  <header class="top-nav">
    <div class="nav-header">
      <div class="brand-title">
        🛍️ <span id="brandLabel">ቦቲካ ሾውሩም</span>
      </div>
      <button class="lang-toggle-btn" id="langToggle">
        <span id="langFlag">🇬🇧</span> <span id="langName">English</span>
      </button>
    </div>

    <!-- Live Search -->
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="ፈልግ (ጫማ፣ ሁዲ፣ ሱሪ፣ ጃኬት)...">
    </div>

    <!-- Department Carousel -->
    <div class="dept-scroll" id="deptTabs">
      <button class="dept-pill active" data-dept="ALL" id="deptAll">🔥 ሁሉም (All)</button>
      <button class="dept-pill" data-dept="shoes" id="deptShoes">👟 ጫማዎች</button>
      <button class="dept-pill" data-dept="hoodies" id="deptHoodies">🧥 ሁዲዎች</button>
      <button class="dept-pill" data-dept="tees" id="deptTees">👕 ቲሸርቶች</button>
      <button class="dept-pill" data-dept="jackets" id="deptJackets">🥼 ጃኬቶች</button>
      <button class="dept-pill" data-dept="pants" id="deptPants">👖 ሱሪዎች</button>
      <button class="dept-pill" data-dept="accessories" id="deptAcc">🧢 መለዋወጫዎች</button>
    </div>
  </header>

  <!-- Secondary Size Filters -->
  <div class="size-filter-bar" id="sizeFilters">
    <span class="size-tag-label" id="sizeLabel">መጠን:</span>
    <button class="size-chip active" data-size="ALL" id="sizeAll">ሁሉም</button>
    <button class="size-chip" data-size="S">S</button>
    <button class="size-chip" data-size="M">M</button>
    <button class="size-chip" data-size="L">L</button>
    <button class="size-chip" data-size="XL">XL</button>
    <button class="size-chip" data-size="EU 42 (US 9)">EU 42</button>
    <button class="size-chip" data-size="EU 43 (US 10)">EU 43</button>
    <button class="size-chip" data-size="EU 44 (US 11)">EU 44</button>
  </div>

  <!-- Catalog Summary -->
  <div class="catalog-bar">
    <span id="catalogCount">ያሉ ዕቃዎች: <b>24</b></span>
    <span id="stockHoldNotice">⚡ የ 30 ደቂቃ ያዝ (Hold)</span>
  </div>

  <!-- Product Grid -->
  <main class="product-grid" id="productGrid"></main>

  <!-- Load More Button -->
  <div class="load-more-wrap" id="loadMoreWrap">
    <button class="load-more-btn" id="loadMoreBtn">ተጨማሪ አሳይ / Show More</button>
  </div>

  <!-- Claim Sheet Modal -->
  <div class="modal-overlay" id="claimModal">
    <div class="modal-sheet">
      <div class="sheet-handle"></div>

      <div class="modal-top-row">
        <img id="modalImg" class="modal-img" src="" alt="Item">
        <div class="modal-details">
          <div id="modalBrand" class="m-brand">BRAND</div>
          <div id="modalTitle" class="m-title">Title</div>
          <div class="m-chips">
            <span id="modalSize" class="m-chip">SIZE</span>
            <span id="modalBadge" class="m-chip">1-OF-1</span>
            <span id="modalPrice" class="m-price">0 ብር</span>
          </div>
        </div>
      </div>

      <div class="payment-notice">
        <div>⏱️ <b id="holdNotice">የ 30 ደቂቃ መያዣ:</b> <span id="holdSub">እቃውን ያዙ! በ 30 ደቂቃ ውስጥ በቴሌብር ወይም በንግድ ባንክ (CBE) ከፍለው ያረጋግጣሉ።</span></div>
        <div class="pay-methods-row">
          <span class="pay-tag">📱 Telebirr</span>
          <span class="pay-tag">🏦 CBE Birr</span>
          <span class="pay-tag">💵 በአካል / Cash</span>
        </div>
      </div>

      <div class="modal-label" id="fulLabel">የመቀበያ መንገድ</div>
      <div class="ful-grid">
        <div class="ful-card selected" id="optPickup" data-val="pickup">
          <h4 id="fulPickTitle">🏬 ከሱቅ መውሰጃ</h4>
          <p id="fulPickSub">በነፃ ይያዛል</p>
        </div>
        <div class="ful-card" id="optDelivery" data-val="delivery">
          <h4 id="fulDelTitle">🚚 በሞተር ማድረሻ</h4>
          <p id="fulDelSub">አዲስ አበባ ውስጥ</p>
        </div>
      </div>

      <div class="modal-label" id="contactLabel">የስልክ ቁጥር ወይም አድራሻ (አማራጭ)</div>
      <input type="text" id="contactInput" class="modal-input" placeholder="09... ወይም @ቴሌግራም">

      <div class="action-buttons-row">
        <a href="tel:+251911000000" class="call-btn" id="callShopBtn">
          📞 <span id="callLabel">ደውል</span>
        </a>
        <button class="claim-btn-main" id="btnConfirmClaim">እቃውን ያዙ (Lock 30 Min)</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Localization Strings
    const I18N = {

      en: {

        langToggle: "አማርኛ",
        langFlag: "🇪🇹",
        searchPlaceholder: "Search shoes, hoodies, tees, jackets...",
        deptAll: "🔥 All Items",
        deptShoes: "👟 Shoes",
        deptHoodies: "🧥 Hoodies",
        deptTees: "👕 Tees",
        deptJackets: "🥼 Jackets",
        deptPants: "👖 Pants",
        deptAcc: "🧢 Accessories",
        sizeLabel: "Size:",
        sizeAll: "All Sizes",
        showing: "Available pieces: ",
        instantHold: "⚡ 30-min hold",
        claimBtn: "Claim",
        loadMore: "Show More",
        holdTitle: "30-Minute Hold:",
        holdSub: "Piece locked! Confirm payment via Telebirr or CBE within 30 minutes.",
        fulLabel: "Fulfillment Method",
        pickupTitle: "🏬 Store Pickup",
        pickupSub: "Free reservation",
        delTitle: "🚚 Courier Delivery",
        delSub: "Addis Ababa delivery",
        contactPlaceholder: "09... or @username",
        callText: "Call Shop",
        confirmBtn: "Lock Piece (30 Min)",
        empty: "No matching pieces found"
      }
    };

    let currentLang = "am";

    // 24 Optimized lightweight catalog items
    const CATALOG = [

      // Accessories
      { id:"botz-acc-01", category:"accessories", brand:"Prada", title:"Re-Nylon Crossbody Messenger Bag", size:"One Size", price:"8,500 ብር", badge:"ኦሪጅናል ቦርሳ", badge_en:"AUTHENTIC LUXURY", badgeClass:"badge-rare", image:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400&q=70&auto=format&fit=crop" },
      { id:"botz-acc-02", category:"accessories", brand:"New Era", title:"NY Yankees 59FIFTY Fitted Cap", size:"7 3/8", price:"1,900 ብር", badge:"ኦሪጅናል ቆብ", badge_en:"LIMITED EDITION", badgeClass:"badge-primary", image:"https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=400&q=70&auto=format&fit=crop" },
      { id:"botz-acc-03", category:"accessories", brand:"Ray-Ban", title:"Wayfarer Classic Polarized Black", size:"Standard", price:"3,400 ብር", badge:"ፖላራይዝድ መነፅር", badge_en:"POLARIZED", badgeClass:"badge-primary", image:"https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=400&q=70&auto=format&fit=crop" },
      { id:"botz-acc-04", category:"accessories", brand:"Porter Yoshida", title:"Tanker 2-Way Travel Tote Bag", size:"One Size", price:"4,900 ብር", badge:"ጃፓን የተሰራ", badge_en:"MADE IN JAPAN", badgeClass:"badge-amber", image:"https://images.unsplash.com/photo-1547949003-9792a18a2601?w=400&q=70&auto=format&fit=crop" }
    ];

    let currentDept = "ALL";
    let currentSize = "ALL";
    let searchQuery = "";
    let visibleCount = 8; // Virtual pagination: loads 8 items initially for max performance
    let selectedItem = null;
    let selectedFulfillment = "pickup";

    const productGrid = document.getElementById("productGrid");
    const catalogCount = document.getElementById("catalogCount");
    const searchInput = document.getElementById("searchInput");
    const loadMoreBtn = document.getElementById("loadMoreBtn");
    const loadMoreWrap = document.getElementById("loadMoreWrap");
    const claimModal = document.getElementById("claimModal");
    const optPickup = document.getElementById("optPickup");
    const optDelivery = document.getElementById("optDelivery");
    const btnConfirmClaim = document.getElementById("btnConfirmClaim");
    const langToggle = document.getElementById("langToggle");

    function applyLanguage() {
      const t = I18N[currentLang];
      document.getElementById("brandLabel").innerText = t.brand;
      document.getElementById("langName").innerText = t.langToggle;
      document.getElementById("langFlag").innerText = t.langFlag;
      searchInput.placeholder = t.searchPlaceholder;
      document.getElementById("deptAll").innerText = t.deptAll;
      document.getElementById("deptShoes").innerText = t.deptShoes;
      document.getElementById("deptHoodies").innerText = t.deptHoodies;
      document.getElementById("deptTees").innerText = t.deptTees;
      document.getElementById("deptJackets").innerText = t.deptJackets;
      document.getElementById("deptPants").innerText = t.deptPants;
      document.getElementById("deptAcc").innerText = t.deptAcc;
      document.getElementById("sizeLabel").innerText = t.sizeLabel;
      document.getElementById("sizeAll").innerText = t.sizeAll;
      document.getElementById("stockHoldNotice").innerText = t.instantHold;
      loadMoreBtn.innerText = t.loadMore;
      document.getElementById("holdNotice").innerText = t.holdTitle;
      document.getElementById("holdSub").innerText = t.holdSub;
      document.getElementById("fulLabel").innerText = t.fulLabel;
      document.getElementById("fulPickTitle").innerText = t.pickupTitle;
      document.getElementById("fulPickSub").innerText = t.pickupSub;
      document.getElementById("fulDelTitle").innerText = t.delTitle;
      document.getElementById("fulDelSub").innerText = t.delSub;
      document.getElementById("contactInput").placeholder = t.contactPlaceholder;
      document.getElementById("callLabel").innerText = t.callText;
      btnConfirmClaim.innerText = t.confirmBtn;
    }

    function renderProducts() {
      productGrid.innerHTML = "";
      const q = searchQuery.toLowerCase().trim();
      const t = I18N[currentLang];

      const filtered = CATALOG.filter(item => {
        if (currentDept !== "ALL" && item.category !== currentDept) return false;
        if (currentSize !== "ALL" && item.size !== currentSize) return false;
        if (q) {
          const match = item.brand.toLowerCase().includes(q) ||
                        item.title.toLowerCase().includes(q) ||
                        item.size.toLowerCase().includes(q) ||
                        item.badge.toLowerCase().includes(q);
          if (!match) return false;
        }
        return true;
      });

      catalogCount.innerHTML = `${t.showing}<b>${filtered.length}</b>`;

      if (filtered.length === 0) {
        productGrid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 40px 10px; color: #64748b;">
            <div style="font-size: 32px; margin-bottom: 6px;">🔎</div>
            <b>${t.empty}</b>
          </div>
        `;
        loadMoreWrap.style.display = "none";
        return;
      }

      // Render up to visibleCount to keep RAM usage feather-light
      const pageItems = filtered.slice(0, visibleCount);
      pageItems.forEach(item => {
        const badgeLabel = currentLang === "en" ? (item.badge_en || item.badge) : item.badge;
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-img-wrap">
            <img class="card-img" src="${item.image}" alt="${item.title}" loading="lazy">
            <span class="card-badge ${item.badgeClass}">${badgeLabel}</span>
            <span class="size-pill">${item.size}</span>
          </div>
          <div class="card-body">
            <div>
              <div class="brand-name">${item.brand}</div>
              <div class="title-name">${item.title}</div>
            </div>
            <div class="card-foot">
              <span class="price-value">${item.price}</span>
              <button class="claim-pill">${t.claimBtn}</button>
            </div>
          </div>
        `;

        card.addEventListener("click", () => openModal(item));
        productGrid.appendChild(card);
      });

      loadMoreWrap.style.display = filtered.length > visibleCount ? "block" : "none";
    }

    // Language Toggle Button
    langToggle.addEventListener("click", () => {
      currentLang = currentLang === "am" ? "en" : "am";
      applyLanguage();
      renderProducts();
    });

    // Load More Pagination
    loadMoreBtn.addEventListener("click", () => {
      visibleCount += 8;
      renderProducts();
    });

    // Search input
    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      visibleCount = 8;
      renderProducts();
    });

    // Department tabs
    document.getElementById("deptTabs").addEventListener("click", (e) => {
      const pill = e.target.closest(".dept-pill");
      if (!pill) return;
      document.querySelectorAll(".dept-pill").forEach(p => p.classList.remove("active"));
      pill.classList.add("active");
      currentDept = pill.dataset.dept;
      visibleCount = 8;
      renderProducts();
    });

    // Size filters
    document.getElementById("sizeFilters").addEventListener("click", (e) => {
      const chip = e.target.closest(".size-chip");
      if (!chip) return;
      document.querySelectorAll(".size-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      currentSize = chip.dataset.size;
      visibleCount = 8;
      renderProducts();
    });

    // Modal controls
    function openModal(item) {
      selectedItem = item;
      document.getElementById("modalImg").src = item.image;
      document.getElementById("modalBrand").innerText = item.brand;
      document.getElementById("modalTitle").innerText = item.title;
      document.getElementById("modalSize").innerText = item.size;
      document.getElementById("modalBadge").innerText = currentLang === "en" ? (item.badge_en || item.badge) : item.badge;
      document.getElementById("modalPrice").innerText = item.price;
      document.getElementById("contactInput").value = "";
      claimModal.classList.add("open");
    }

    function closeModal() {
      claimModal.classList.remove("open");
      selectedItem = null;
    }

    claimModal.addEventListener("click", (e) => {
      if (e.target === claimModal) closeModal();
    });

    // Fulfillment toggles
    optPickup.addEventListener("click", () => {
      selectedFulfillment = "pickup";
      optPickup.classList.add("selected");
      optDelivery.classList.remove("selected");
    });

    optDelivery.addEventListener("click", () => {
      selectedFulfillment = "delivery";
      optDelivery.classList.add("selected");
      optPickup.classList.remove("selected");
    });

    // Confirm Claim & send data back to Bot
    btnConfirmClaim.addEventListener("click", () => {
      if (!selectedItem) return;

      const payload = {
        action: "claim_item",
        item_id: selectedItem.id,
        brand: selectedItem.brand,
        title: selectedItem.title,
        size: selectedItem.size,
        price: selectedItem.price,
        fulfillment: selectedFulfillment,
        contact: document.getElementById("contactInput").value.trim() || "N/A",
        timestamp: new Date().toISOString()
      };

      if (tg && typeof tg.sendData === "function") {
        tg.sendData(JSON.stringify(payload));
        tg.close();
      } else {
        const msg = currentLang === "am"
          ? `✅ እቃው ተይዟል!\n\n${selectedItem.brand} — ${selectedItem.title}\nዋጋ: ${selectedItem.price}\nየ 30 ደቂቃ መያዣ ተጀምሯል።`
          : `✅ Item Claimed!\n\n${selectedItem.brand} — ${selectedItem.title}\nPrice: ${selectedItem.price}\n30-minute hold initiated.`;
        alert(msg);
        closeModal();
      }
    });

    // Init
    applyLanguage();
    renderProducts();
  </script>
